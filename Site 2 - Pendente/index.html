<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site 2</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="page">
    <section class="login">
      <h2 class="login__title">WELCOME BACK!</h2>
      <p class="login__subtitle">Don’t have a account, <span class="login__signup">Sign up</span></p>
      <form class="login__form">
        <label for="username" class="form__label">Username</label>
        <input id="username" class="form__input" type="text" placeholder="daniel123@gmail.com" />

        <label for="password" class="form__label">Password</label>
        <input id="password" class="form__input form__input--password" type="password" placeholder="••••••" value="123456" />
      </form>

      <div class="login__options">
        <label class="checkbox">
          <input type="checkbox" class="checkbox__input" checked />
          Remember me
        </label>
        <p class="forgot">Forget password?</p>
      </div>

      <button class="btn">Sign In</button>

      <p class="divider">or continue with</p>

      <div class="social">
        <img class="social__icon" src="google.svg" alt="google" />
        <img class="social__icon" src="facebook.svg" alt="facebook" />
        <img class="social__icon" src="Group.svg" alt="apple" />
      </div>
    </section>

    <section class="hero">
      <header class="topbar">
        <nav class="topbar__nav">
          <ul class="topbar__list">
            <li class="topbar__item">Help</li>
            <li class="topbar__item">Contact us</li>
            <li class="topbar__item">English ▾</li>
            <li class="topbar__item">Sign Up</li>
            <li class="topbar__item topbar__item--icon"><img class="topbar__icon" src="Vector.svg" alt="casinha" /></li>
          </ul>
        </nav>
      </header>
      <img class="hero__image" src="Exlorer_Illustration_1.png" alt="imagem section" />
    </section>
  </div>
</body>
</html>
